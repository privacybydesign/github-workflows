name: Release please

on:
  push:
    branches: [$default-branch]

permissions: {}

jobs:
  release-please:
    uses: privacybydesign/github-workflows/.github/workflows/release-please.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
