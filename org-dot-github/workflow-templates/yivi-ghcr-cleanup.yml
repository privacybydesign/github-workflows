# Weekly GHCR retention: delete unreferenced untagged versions (old edge builds).
# Starts as a dry run: check the job summary, then set dry-run: false.
name: GHCR clean-up

on:
  schedule:
    - cron: "41 3 * * 0" # Sundays
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    uses: privacybydesign/github-workflows/.github/workflows/ghcr-cleanup.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      dry-run: true
      min-age-days: 14
      # delete-tags-regex: 'feature-.*|fix-.*'  # branch tags from manual runs; never match edge or versions
      # tag-max-age-days: 90
