# Build Go binaries for a tag, attach them (+ SBOM, checksums, attestations)
# to a DRAFT release and publish it. Works with immutable releases.
# With release-please: set "draft": true and "force-tag-creation": true.
name: Release binaries

on:
  push:
    tags: ["v*"]
  pull_request: # smoke-test the build matrix, nothing is uploaded

permissions: {}

jobs:
  binaries:
    uses: privacybydesign/github-workflows/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary-name: CHANGE_ME
      main-package: ./cmd/CHANGE_ME
      # version-variable: main.version
      # require-changelog-entry: true
    secrets:
      # Publishing with the App makes 'release: published' (Delivery) run.
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
