# Status checks for a Go service/library (optionally with a Dockerfile).
name: Status checks

on:
  push:
    branches: [main] # your default branch
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays: govulncheck and image scan against fresh databases
  workflow_dispatch:

permissions: {}

# A new push to a PR cancels the PR's previous run. Other events get a
# group of their own (run_id), so they never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go:
    uses: privacybydesign/github-workflows/.github/workflows/go-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: .
      # Coverage and test results for the sonarqube job (artifact "coverage").
      coverage-file: coverage.out
      test-report-file: report.json
      upload-coverage: true
      # test-dockerfile: Dockerfile.test
      # apt-packages: libpcsclite-dev

  # Build + scan the image on PRs without pushing. Remove if there is no Dockerfile.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      push-image: false

  dependency-review:
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  # SonarQube Cloud quality gate. Public repositories only: on a private
  # repository it succeeds without analysing. Needs the SONAR_TOKEN secret.
  sonarqube:
    needs: go # waits for the coverage artifact
    uses: privacybydesign/github-workflows/.github/workflows/sonarqube.yml@v1
    permissions:
      contents: read
      pull-requests: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      coverage-artifact: coverage
      exclusions: ${{ vars.SONAR_EXCLUSIONS || '**/*_test.go,**/vendor/**,**/testdata/**' }}
      args: >-
        -Dsonar.tests=.
        -Dsonar.test.inclusions=**/*_test.go
        -Dsonar.go.tests.reportPaths=report.json
        -Dsonar.go.coverage.reportPaths=coverage.out
        -Dsonar.issue.ignore.multicriteria=e1,e2
        -Dsonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
        -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
        -Dsonar.issue.ignore.multicriteria.e2.ruleKey=go:S107
        -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/fuzz_test.go

  # Single required check for rulesets/branch protection: job names inside this
  # workflow can change without touching the ruleset.
  passed:
    name: Status checks passed
    if: always()
    needs: [go, docker, dependency-review, workflow-lint, sonarqube]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
