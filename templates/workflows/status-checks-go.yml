# Status checks for a Go service/library (optionally with a Dockerfile).
name: Status checks

on:
  push:
    branches: [main] # your default branch
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays: govulncheck and image scan against fresh databases
  workflow_dispatch:

permissions: {}

jobs:
  go:
    uses: privacybydesign/github-workflows/.github/workflows/go-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: .
      # test-dockerfile: Dockerfile.test
      # apt-packages: libpcsclite-dev

  # Build + scan the image on PRs without pushing. Remove if there is no Dockerfile.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      push-image: false

  dependency-review:
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  # Single required check for rulesets/branch protection: job names inside this
  # workflow can change without touching the ruleset.
  passed:
    name: Status checks passed
    if: always()
    needs: [go, docker, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
