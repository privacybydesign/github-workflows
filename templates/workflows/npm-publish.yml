# Publish to npm when a GitHub release is published.
# One-time setup on npmjs.com: package > Settings > Trusted Publisher >
#   GitHub Actions, owner privacybydesign, this repository, workflow file = THIS file's name.
name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  npm:
    uses: privacybydesign/github-workflows/.github/workflows/npm-publish.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # with:
    #   release-command: npm run release   # semantic-release instead of tag-driven
