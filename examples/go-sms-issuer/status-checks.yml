# go-sms-issuer: Status checks (shared workflows v1.1).
# Replaces status-checks.yml; the PR image build+scan moved here (push-image: false).
name: Status checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  frontend:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: frontend
      scripts: build # add "test" to also run vitest
      ignore-scripts: true

  go:
    uses: privacybydesign/github-workflows/.github/workflows/go-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: backend
      test-dockerfile: Dockerfile.test
      coverage-file: /coverage/coverage.out # Dockerfile.test writes here
      codecov: true
      codecov-flags: backend
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      push-image: false
    secrets:
      # Public Cloudflare Turnstile site key, baked into the frontend bundle.
      DOCKER_BUILD_ARGS: TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}

  codeql:
    uses: privacybydesign/github-workflows/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      languages: '["go", "javascript-typescript", "actions"]'
      go-version-file: backend/go.mod
      go-build-command: cd backend && go build ./...

  dependency-review:
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  passed:
    name: Status checks passed
    if: always()
    needs: [frontend, go, docker, codeql, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
