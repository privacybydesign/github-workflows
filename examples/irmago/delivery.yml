# irmago (shared workflows v1.1): Docker image + CLI binaries.
# Tag push (v*) builds binaries, attaches them to a DRAFT release and
# publishes it (immutable-release compatible); the same tag push publishes
# the :<version> / :latest images.
name: Delivery

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request: # smoke-test the binary matrix
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    if: github.event_name != 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ghcr.io/privacybydesign/yivi
      platforms: linux/amd64,linux/arm64
      tag-latest: true

  binaries:
    uses: privacybydesign/github-workflows/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary-name: yivi
      main-package: ./yivi
      require-changelog-entry: true
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
