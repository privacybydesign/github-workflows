# veramo-mock-as: copy to .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker # bumps golang/alpine tags AND @sha256 digests
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      docker: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: gomod # no dependencies today; keeps the go directive visible
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
