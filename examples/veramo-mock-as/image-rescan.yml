# veramo-mock-as: weekly re-scan of the published image (amd64 + arm64).
name: Image rescan

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays
  workflow_dispatch:

permissions: {}

jobs:
  rescan:
    uses: privacybydesign/github-workflows/.github/workflows/image-rescan.yml@v1
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      tags: edge latest # no GitHub releases in this repository
      severity-cutoff: high
