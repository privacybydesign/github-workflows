# veramo-mock-as: retention. Every push to main used to add a :sha-<short>
# tag, so tagged versions pile up as well as untagged ones.
name: GHCR clean-up

on:
  schedule:
    - cron: "41 3 * * 0" # Sundays
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    uses: privacybydesign/github-workflows/.github/workflows/ghcr-cleanup.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      dry-run: true # check the job summary first
      min-age-days: 14
      delete-tags-regex: 'sha-[0-9a-f]{7}'
      tag-max-age-days: 90
