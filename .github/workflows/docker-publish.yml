# Reusable workflow: build, scan and publish a container image to GHCR.
#
# Mirrors the "Delivery" workflow that most privacybydesign repositories use
# today (build -> Anchore scan -> push to ghcr.io/<repo>), with these fixes:
#
#   * The bytes that are scanned are the bytes that are published. The image
#     is built once into an OCI archive on the runner, scanned there, and only
#     pushed (digest-preserving, with skopeo) when the scan passes. Nothing
#     reaches GHCR on a failed scan. (Today most repos build twice and rely
#     on the GHA cache to produce the same image.)
#   * Multi-arch works with the scan gate (load: true cannot do multi-arch).
#   * Release candidates get only their full tag (1.2.0-rc.1) instead of
#     overwriting 1.2.0.
#   * One concurrency group per image, so edge tags are never applied out of
#     order.
#
# Behaviour per caller event:
#   pull_request       build (first platform) + scan, never push
#   schedule           build (first platform) + scan, never push (weekly CVE check)
#   push (default br.) build + scan + push :edge   (only if the commit is still HEAD)
#   release published  build + scan + push :<version> [+ :<major>.<minor>, :<major>, :latest]
#   push of a v* tag   same as a release (use this with immutable/draft releases)
#   workflow_dispatch  build + scan + push :<branch-name> (+ :edge when run on the default branch HEAD)
#
# v1.1 additions: `push-image: false` (check-only mode for Status checks),
# release commits must be on the default branch, Dockerfile build checks,
# base-image digest pinning check, reproducible images (SOURCE_DATE_EPOCH),
# optional keyless cosign signing, job timeout.
#
# Required caller permissions:
#   contents: read, packages: write, security-events: write,
#   id-token: write, attestations: write   (always required by the job; only used
#   for attestations on public repos and for cosign)

name: Docker publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name. Defaults to ghcr.io/<owner>/<repo> (lowercased).
        type: string
        default: ""
      context:
        description: Docker build context.
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile (relative to the repository root).
        type: string
        default: Dockerfile
      target:
        description: Optional build stage to target.
        type: string
        default: ""
      build-args:
        description: Newline-separated KEY=VALUE build arguments.
        type: string
        default: ""
      platforms:
        description: Comma-separated platforms, e.g. linux/amd64,linux/arm64.
        type: string
        default: linux/amd64
      tag-latest:
        description: Also tag :latest when publishing the latest stable GitHub release.
        type: boolean
        default: false
      tag-semver-rollups:
        description: Also tag :<major>.<minor> and :<major> on stable releases.
        type: boolean
        default: false
      scan:
        description: Scan the image with Anchore (Grype).
        type: boolean
        default: true
      scan-severity-cutoff:
        description: Minimum severity that fails the build (negligible, low, medium, high, critical).
        type: string
        default: critical
      scan-fail-build:
        description: Fail when fixable vulnerabilities at or above the cutoff are found.
        type: boolean
        default: true
      attest:
        description: Push a SLSA build-provenance attestation (public repositories only).
        type: boolean
        default: true
      push-image:
        description: Set to false to only build and scan (e.g. from a Status checks workflow).
        type: boolean
        default: true
      require-release-on-default-branch:
        description: Refuse to publish a release/tag whose commit is not on the default branch.
        type: boolean
        default: true
      dockerfile-check:
        description: Run BuildKit's Dockerfile checks (docker build --check). error, warn or off.
        type: string
        default: warn
      base-image-pinning:
        description: Check that FROM images are pinned by @sha256 digest. error, warn or off.
        type: string
        default: warn
      reproducible:
        description: Set SOURCE_DATE_EPOCH to the commit time and rewrite file timestamps, so rebuilds give the same digest.
        type: boolean
        default: true
      cosign:
        description: >-
          Also sign the image with keyless cosign (Sigstore). Works for private repositories, but the
          signature (incl. repository name) is recorded in the PUBLIC Rekor transparency log.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 60
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
    secrets:
      DOCKER_BUILD_ARGS:
        description: >-
          Newline-separated KEY=VALUE build arguments taken from secrets, e.g.
          TURNSTILE_SITE_KEY=<value of a repo secret>. Build args end up
          in the image metadata, so only use this for values that are public anyway.
        required: false
      DOCKER_BUILD_SECRETS:
        description: >-
          Newline-separated id=value BuildKit secrets (RUN --mount=type=secret,id=...).
          Use this for real secrets; they are never stored in the image.
        required: false
    outputs:
      image:
        description: Image name without tag.
        value: ${{ jobs.docker.outputs.image }}
      digest:
        description: Digest of the published image (empty when nothing was published).
        value: ${{ jobs.docker.outputs.digest }}
      tags:
        description: Newline-separated list of published tags (empty when nothing was pushed).
        value: ${{ jobs.docker.outputs.tags }}
      published:
        description: "'true' when the image was pushed."
        value: ${{ jobs.docker.outputs.published }}

permissions: {}

jobs:
  docker:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    concurrency:
      # One group per ref: edge runs on a branch are serialised (a newer pending run
      # replaces an older pending one), each release tag gets its own group so a
      # pending release is never cancelled by a later push. Check-only runs cancel.
      group: docker-${{ github.repository }}-${{ inputs.image-name }}-${{ inputs.dockerfile }}-${{ inputs.push-image && 'publish' || 'check' }}-${{ github.ref }}
      cancel-in-progress: ${{ !inputs.push-image || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    outputs:
      image: ${{ steps.prepare.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.push.outputs.tags }}
      published: ${{ steps.push.outputs.published == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Commit timestamp
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Check base images are pinned by digest
        if: inputs.base-image-pinning != 'off'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          MODE: ${{ inputs.base-image-pinning }}
        run: |
          set -euo pipefail
          # Collect FROM images; skip scratch, earlier stage names and ARG-based references.
          unpinned="$(awk '
            toupper($1)=="FROM" {
              i=2; while ($i ~ /^--/) i++
              img=$i; stage=""
              if (toupper($(i+1))=="AS") stage=tolower($(i+2))
              if (img!="scratch" && !(tolower(img) in stages) && img !~ /\$/ && img !~ /@sha256:/) print FILENAME ":" NR ": " img
              if (stage!="") stages[stage]=1
            }' "$DOCKERFILE")"
          if [ -n "$unpinned" ]; then
            level=warning; [ "$MODE" = error ] && level=error
            while IFS= read -r l; do echo "::${level}::Base image not pinned by digest (use image:tag@sha256:..., Dependabot keeps it updated): ${l}"; done <<< "$unpinned"
            [ "$MODE" = error ] && exit 1
          fi
          true

      - name: Determine what to publish
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_IMAGE: ${{ inputs.image-name }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_CONTEXT: ${{ inputs.context }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          PUSH_IMAGE: ${{ inputs.push-image }}
          REQUIRE_DEFAULT: ${{ inputs.require-release-on-default-branch }}
        run: |
          set -euo pipefail
          image="${INPUT_IMAGE:-ghcr.io/${REPO}}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"

          publish=false; is_head=false; is_latest=false
          case "$EVENT" in
            push)
              if [[ "$REF" == refs/tags/* ]]; then
                # Tag push is treated like a published release (draft/immutable release flows).
                tag="${REF#refs/tags/}"
                publish=true
                if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  highest="$(gh api "repos/${REPO}/tags" --paginate --jq '.[].name' \
                    | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
                  [ "$highest" = "$tag" ] && is_latest=true
                fi
              elif [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                head="$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)"
                if [ "$head" = "$SHA" ]; then is_head=true; publish=true
                else echo "::notice::${SHA} is no longer HEAD of ${DEFAULT_BRANCH}; not tagging edge."; fi
              fi ;;
            release)
              publish=true
              if [ "$RELEASE_PRERELEASE" != "true" ]; then
                latest="$(gh release view --repo "$REPO" --json tagName --jq .tagName || true)"
                [ "$latest" = "$RELEASE_TAG" ] && is_latest=true
              fi ;;
            workflow_dispatch)
              publish=true
              # A manual run on the default branch also refreshes :edge (e.g. to pick up
              # patched base images), as the existing Delivery workflows do.
              if [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                head="$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)"
                [ "$head" = "$SHA" ] && is_head=true
              fi ;;
          esac

          # Releases must come from the default branch (irmago did this; v1.0 did not).
          if [ "$publish" = true ] && [ "$REQUIRE_DEFAULT" = true ] && \
             { [ "$EVENT" = release ] || [[ "$REF" == refs/tags/* ]]; }; then
            status="$(gh api "repos/${REPO}/compare/${DEFAULT_BRANCH}...${SHA}" --jq .status)"
            case "$status" in
              behind|identical) ;;
              *) echo "::error::Release commit ${SHA} is not on ${DEFAULT_BRANCH} (compare status: ${status})."; exit 1 ;;
            esac
          fi

          if [ "$PUSH_IMAGE" != true ]; then publish=false; is_head=false; is_latest=false; fi

          # Local (non-publishing) builds can only load a single platform.
          first_platform="$(echo "$INPUT_PLATFORMS" | cut -d, -f1 | tr -d ' ')"
          multi_arch=false
          case "$INPUT_PLATFORMS" in *,*) multi_arch=true ;; esac

          {
            echo "image=$image"
            # Unique per image/Dockerfile/context: cache scope and SARIF category.
            echo "slug=$(printf '%s-%s-%s' "${image##*/}" "$INPUT_DOCKERFILE" "$INPUT_CONTEXT" | tr -c 'A-Za-z0-9._-' '-')"
            echo "publish=$publish"
            echo "is-head=$is_head"
            echo "is-latest=$is_latest"
            echo "first-platform=$first_platform"
            echo "multi-arch=$multi_arch"
          } >> "$GITHUB_OUTPUT"
          echo "image=$image publish=$publish edge=$is_head latest=$is_latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.prepare.outputs.image }}
          flavor: latest=false
          # {{major}}/{{major}}.{{minor}} are skipped automatically for pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.tag-semver-rollups }}
            type=semver,pattern={{major}},enable=${{ inputs.tag-semver-rollups }}
            type=raw,value=latest,enable=${{ inputs.tag-latest && steps.prepare.outputs.is-latest == 'true' }}
            type=edge,enable=${{ steps.prepare.outputs.is-head == 'true' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up QEMU
        if: steps.prepare.outputs.multi-arch == 'true' || !contains(inputs.platforms, 'amd64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Dockerfile checks
        if: inputs.dockerfile-check != 'off'
        continue-on-error: ${{ inputs.dockerfile-check != 'error' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          call: check

      # Build ONCE into an OCI archive on the runner. Nothing touches the registry
      # until the scan has passed, so a failed scan leaves nothing behind in GHCR.
      - name: Build image into OCI archive
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          # Reproducible builds: same commit -> same digest.
          SOURCE_DATE_EPOCH: ${{ inputs.reproducible && steps.epoch.outputs.epoch || '' }}
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: |
            ${{ inputs.build-args }}
            ${{ secrets.DOCKER_BUILD_ARGS }}
          secrets: ${{ secrets.DOCKER_BUILD_SECRETS }}
          # Non-publishing runs only build the platform that gets scanned.
          platforms: ${{ steps.prepare.outputs.publish == 'true' && inputs.platforms || steps.prepare.outputs.first-platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=oci,dest=${{ runner.temp }}/image.oci.tar${{ inputs.reproducible && ',rewrite-timestamp=true' || '' }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ steps.prepare.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.prepare.outputs.slug }}

      - name: Install skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo; }

      # Pull the scan platform's manifest out of the archive (byte-for-byte, same
      # digest as inside the published index) into an OCI layout Grype can read.
      - name: Prepare image for scanning
        id: oci
        env:
          ARCHIVE: ${{ runner.temp }}/image.oci.tar
          LAYOUT: ${{ runner.temp }}/scan-layout
          PLATFORM: ${{ steps.prepare.outputs.first-platform }}
        run: |
          set -euo pipefail
          digest="$(tar -xOf "$ARCHIVE" index.json | jq -r '.manifests[0].digest')"
          IFS=/ read -r os arch variant <<< "$PLATFORM"
          args=(--override-os "$os" --override-arch "$arch")
          [ -n "${variant:-}" ] && args+=(--override-variant "$variant")
          skopeo --insecure-policy copy --preserve-digests "${args[@]}" \
            "oci-archive:${ARCHIVE}" "oci:${LAYOUT}:scan"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "layout=$LAYOUT" >> "$GITHUB_OUTPUT"

      - name: Scan image
        id: scan
        if: inputs.scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: oci-dir:${{ steps.oci.outputs.layout }}
          only-fixed: true
          fail-build: ${{ inputs.scan-fail-build }}
          severity-cutoff: ${{ inputs.scan-severity-cutoff }}
          output-format: sarif

      - name: Upload scan results to code scanning
        if: ${{ !cancelled() && inputs.scan && steps.scan.outputs.sarif != '' }}
        # Fork PRs cannot write security events; never fail the job on this.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: anchore-${{ steps.prepare.outputs.slug }}

      # Only reached when the scan passed. Pushes the archive as-is
      # (--preserve-digests fails instead of re-encoding), straight to its tags.
      - name: Push scanned image
        id: push
        if: steps.prepare.outputs.publish == 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/image.oci.tar
          IMAGE: ${{ steps.prepare.outputs.image }}
          DIGEST: ${{ steps.oci.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(grep -v '^$' <<< "$TAGS" || true)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::warning::No tags apply to this run (e.g. manual run on a tag ref); nothing pushed."
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for tag in "${tags[@]}"; do
            # Blobs and child manifests already present are skipped by the registry,
            # so pushing the same archive to every tag costs one upload.
            skopeo --insecure-policy copy --all --preserve-digests --retry-times 3 \
              "oci-archive:${ARCHIVE}" "docker://${tag}"
            remote="sha256:$(skopeo inspect --raw "docker://${tag}" | sha256sum | cut -d' ' -f1)"
            if [ "$remote" != "$DIGEST" ]; then
              echo "::error::${tag} has digest ${remote}, expected ${DIGEST}"; exit 1
            fi
          done
          {
            echo "published=true"
            echo "digest=$DIGEST"
            echo "tags<<__TAGS__"
            printf '%s\n' "${tags[@]}"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published ${IMAGE}@${DIGEST}"
            echo '```'
            printf '%s\n' "${tags[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: steps.push.outputs.published == 'true' && inputs.attest && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.prepare.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: steps.push.outputs.published == 'true' && inputs.cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: steps.push.outputs.published == 'true' && inputs.cosign
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
