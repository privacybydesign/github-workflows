# Reusable workflow: release-please (changelog + version bump PRs + GitHub releases).
#
# Releases created with the default GITHUB_TOKEN do NOT trigger other
# workflows, so a `release: published` delivery workflow would never run.
# Pass the org GitHub App (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY) so
# the release is created with an App token and downstream workflows fire.
#
# Immutable releases + Go binaries: set `"draft": true` and
# `"force-tag-creation": true` in release-please-config.json. release-please
# then creates a draft and pushes the tag (with the App token, so the
# tag-push triggers go-release.yml, which uploads assets and publishes).
#
# Caller trigger: push to the default branch.
# Required caller permissions: contents: write, pull-requests: write, issues: write

name: Release please

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      release-created:
        value: ${{ jobs.release-please.outputs.release-created }}
      tag-name:
        value: ${{ jobs.release-please.outputs.tag-name }}
      version:
        value: ${{ jobs.release-please.outputs.version }}

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check for GitHub App
        id: app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: echo "enabled=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Warn about GITHUB_TOKEN
        if: steps.app.outputs.enabled != 'true'
        run: echo "::warning::No RELEASE_APP_ID given; releases made with GITHUB_TOKEN will not trigger release workflows."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
