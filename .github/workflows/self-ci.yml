# CI for this repository: lint every workflow with actionlint and zizmor
# (using the shared workflow-lint.yml from this same commit).
name: Self CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml
    permissions:
      contents: read
    with:
      zizmor-config: zizmor.yml
      paths: .github
      actionlint-paths: .github/workflows

  passed:
    name: Status checks passed
    if: always()
    needs: [workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
